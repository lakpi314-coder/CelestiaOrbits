name: Build Application for All OS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: my-app-linux
          - os: windows-latest
            artifact_name: my-app-windows
          - os: macos-latest
            artifact_name: my-app-macos

    runs-on: ${{ matrix.os }}

    steps:
    - name: Check out source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # If your app requires external libraries (like requests or pygame), list them here:
        # pip install requests pygame

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile main.py

    - name: Upload Finished Executable
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/*
